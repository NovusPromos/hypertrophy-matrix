<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hypertrophy</title>
    
    <!-- PWA Icon & App Metadata -->
    <link rel="icon" type="image/jpeg" href="workout-icon.jpg">
    <link rel="apple-touch-icon" href="workout-icon.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Workout">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button, 
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .hidden-transition { max-height: 0; opacity: 0; overflow: hidden; transition: max-height 0.3s ease-out, opacity 0.3s ease-out; }
        .show-transition { max-height: 500px; opacity: 1; transition: max-height 0.4s ease-in, opacity 0.4s ease-in; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased pb-20">
    <div id="app" class="max-w-md mx-auto p-4"></div>

    <script>
        const workoutPlan = {
            Monday: [
                { name: "Romanian Deadlift", sets: 4, reps: "8-10", equip: "Loose Dumbbells", desc: "Keep legs nearly straight with a micro-bend in knees. Push hips backward, sliding dumbbells down thighs. Drive hips forward to stand. Squeeze glutes. Do not lean backward at the top." },
                { name: "Leg Press", sets: 3, reps: "10-12", equip: "Circuit Machine", desc: "Lower the sled until your knees hit a 90-degree angle. Press back up by driving firmly through your heels. Do not lock your knees violently at the peak of the movement." },
                { name: "Leg Curl", sets: 3, reps: "12-15", equip: "Circuit Machine", desc: "Align the machine's rotation axis directly with your knee joint. Set ankle pad just above the Achilles tendon. Pull down using only hamstrings; keep your hips pinned to the seat." },
                { name: "Floor Crunches", sets: 3, reps: "15-20", equip: "Bodyweight", desc: "Lie flat with knees bent. Contract your rectus abdominis to lift your shoulder blades off the floor. Do not pull on your neck. Lower under strict control." }
            ],
            Tuesday: [
                { name: "Chest Press", sets: 4, reps: "8-10", equip: "Circuit Machine", desc: "Adjust seat so horizontal handles align with your mid-chest (nipple line). Retract shoulder blades firmly against the back pad before pressing. Do not let shoulders roll forward at lockout." },
                { name: "Lat Pulldown", sets: 4, reps: "8-10", equip: "Circuit Machine", desc: "Lock legs beneath the thigh pad. Grip slightly wider than shoulder-width. Lean slightly back and pull the bar to your upper chest by driving your elbows down toward the floor." },
                { name: "Overhead Tricep Ext", sets: 3, reps: "10-12", equip: "Loose Dumbbell", desc: "Hold one heavy dumbbell vertically overhead. Keeping elbows pointed directly up at the ceiling, lower the weight behind your head until forearms break parallel. Press up to full lockout." },
                { name: "Bicep Curl", sets: 3, reps: "10-12", equip: "Circuit Machine", desc: "Align your elbows perfectly with the machine's axis of rotation. Curl the weight upwards in a controlled motion, squeezing at the top. Lower the weight slowly to full extension." }
            ],
            Wednesday: [
                { name: "Goblet Squat", sets: 4, reps: "8-10", equip: "Loose Dumbbell", desc: "Hold dumbbell vertically against chest. Break at hips and knees simultaneously. Drop pelvis straight down between heels, keeping chest upright. Drive up through the mid-foot." },
                { name: "Walking Lunges", sets: 3, reps: "10-12/leg", equip: "Bodyweight", desc: "Step forward and drop your back knee straight down toward the floor. Keep front knee aligned over your toes. Push through the front heel to bring your back leg forward." },
                { name: "Leg Extension", sets: 3, reps: "12-15", equip: "Circuit Machine", desc: "Align knee joint with machine axis. Extend legs fully to contract quadriceps without jerking the weight. Lower the weight under strict control; do not let the plates crash." },
                { name: "Cycling", sets: 1, reps: "15 mins", equip: "Cycling Station", desc: "Maintain a moderate, consistent pace against heavy resistance. Focus on sustained output and metabolic conditioning rather than sheer speed." }
            ],
            Thursday: [
                { name: "Seated Row", sets: 3, reps: "10-12", equip: "Circuit Machine", desc: "Adjust chest pad so you stretch slightly to reach handles. Pull by retracting shoulder blades and driving elbows strictly backward. Do not lean backward to generate momentum." },
                { name: "Shoulder Press", sets: 3, reps: "8-10", equip: "Circuit Machine", desc: "Adjust seat so handles sit just above shoulders. Keep elbows slightly tucked forward (approx 30 degrees), not flared directly out. Press straight up under control." },
                { name: "Lying DB Tricep Ext", sets: 4, reps: "12-15", equip: "Loose Dumbbells", desc: "Lie on a flat bench holding dumbbells over your chest. Lower dumbbells to the sides of your head by bending the elbows, keeping upper arms entirely vertical. Press back to lockout." },
                { name: "Hammer Curls", sets: 4, reps: "12-15", equip: "Loose Dumbbells", desc: "Stand holding dumbbells with a neutral grip (palms facing legs). Curl weights toward shoulders keeping palms facing each other. Do not swing hips to generate momentum." },
                { name: "Lateral Raises", sets: 4, reps: "15-20", equip: "Loose Dumbbells", desc: "Stand holding dumbbells. Raise arms out to the sides until parallel with the floor, leading slightly with your elbows. Control the lowering phase strictly." }
            ]
        };

        const storageKey = 'hypertrophy_matrix_v3';
        let logData = JSON.parse(localStorage.getItem(storageKey)) || {};
        let currentDay = 'Monday';
        let expandedInfo = {}; 

        function saveData() {
            localStorage.setItem(storageKey, JSON.stringify(logData));
        }

        function handleInput(day, exerciseIndex, setIndex, field, value) {
            const key = day + '_' + exerciseIndex + '_' + setIndex;
            if (!logData[key]) logData[key] = { weight: '', reps: '' };
            logData[key][field] = value;
            saveData();
        }

        function toggleInfo(exerciseIndex) {
            expandedInfo[exerciseIndex] = !expandedInfo[exerciseIndex];
            renderApp();
        }

        function renderApp() {
            const app = document.getElementById('app');
            
            let daysHtml = '';
            const days = Object.keys(workoutPlan);
            for(let i=0; i<days.length; i++) {
                const d = days[i];
                const btnClass = (currentDay === d) ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400';
                daysHtml += '<button onclick="setDay(\'' + d + '\')" class="px-4 py-2 text-sm font-semibold rounded ' + btnClass + ' whitespace-nowrap transition-colors">' + d + '</button>';
            }

            let html = '<header class="mb-6 sticky top-0 bg-gray-900 py-4 z-10 border-b border-gray-800">' +
                       '<h1 class="text-xl font-bold text-blue-400 mb-4 tracking-tight">PROGRESSIVE OVERLOAD</h1>' +
                       '<div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-hide">' + daysHtml + '</div>' +
                       '</header><main class="space-y-6">';

            const currentWorkout = workoutPlan[currentDay];
            for (let exIdx = 0; exIdx < currentWorkout.length; exIdx++) {
                const ex = currentWorkout[exIdx];
                const isExpanded = !!expandedInfo[exIdx];
                const expandClass = isExpanded ? 'show-transition py-3' : '';
                const opacityClass = isExpanded ? 'opacity-100' : 'opacity-0';

                html += '<div class="bg-gray-800 rounded-lg p-4 border border-gray-700 shadow-sm">' +
                        '<div class="mb-3 flex justify-between items-start">' +
                        '<div><div class="flex items-center space-x-2">' +
                        '<h2 class="font-bold text-lg text-gray-100">' + ex.name + '</h2>' +
                        '<button onclick="toggleInfo(' + exIdx + ')" class="text-gray-400 hover:text-blue-400 focus:outline-none bg-gray-700 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold transition-colors">?</button>' +
                        '</div><p class="text-xs text-gray-400 uppercase tracking-wider mt-1">' + ex.equip + '</p></div>' +
                        '<span class="bg-gray-700 text-blue-300 text-xs px-2 py-1 rounded font-mono">' + ex.sets + ' &times; ' + ex.reps + '</span>' +
                        '</div>' +
                        '<div class="bg-gray-700 rounded text-sm text-gray-300 px-3 py-0 mb-3 hidden-transition ' + expandClass + '">' +
                        '<p class="' + opacityClass + ' transition-opacity duration-300">' + ex.desc + '</p>' +
                        '</div><div class="space-y-2">';

                for (let s = 0; s < ex.sets; s++) {
                    const key = currentDay + '_' + exIdx + '_' + s;
                    const weightVal = logData[key] ? logData[key].weight : '';
                    const repsVal = logData[key] ? logData[key].reps : '';

                    html += '<div class="flex items-center space-x-3 bg-gray-900 p-2 rounded border border-gray-800">' +
                            '<span class="text-gray-500 w-12 text-sm font-mono">Set ' + (s + 1) + '</span>' +
                            '<div class="flex-1 flex space-x-2">' +
                            '<input type="number" step="0.5" placeholder="kg" value="' + weightVal + '" oninput="handleInput(\'' + currentDay + '\', ' + exIdx + ', ' + s + ', \'weight\', this.value)" class="w-full bg-gray-700 text-white text-center rounded p-2 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-500 transition-shadow">' +
                            '<input type="number" placeholder="reps" value="' + repsVal + '" oninput="handleInput(\'' + currentDay + '\', ' + exIdx + ', ' + s + ', \'reps\', this.value)" class="w-full bg-gray-700 text-white text-center rounded p-2 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-500 transition-shadow">' +
                            '</div></div>';
                }
                html += '</div></div>';
            }
            html += '</main>';
            app.innerHTML = html;
        }

        window.setDay = function(day) {
            currentDay = day;
            expandedInfo = {};
            renderApp();
        };

        renderApp();
    </script>
</body>
</html>
